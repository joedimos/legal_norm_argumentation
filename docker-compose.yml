x-vle-environment: &vle-environment
  VLE_ENVIRONMENT: production
  VLE_DATABASE_URL: postgresql+psycopg://vle:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/vle_legato
  VLE_BUILD_REVISION: ${VLE_BUILD_REVISION:?set exact deployed Git SHA}
  VLE_API_KEYS_JSON: ${VLE_API_KEYS_JSON:?set VLE_API_KEYS_JSON}
  VLE_METRICS_BEARER_TOKEN: ${VLE_METRICS_BEARER_TOKEN:?set VLE_METRICS_BEARER_TOKEN}
  VLE_CORS_ORIGINS_CSV: ${VLE_CORS_ORIGINS_CSV:-}
  VLE_OTLP_ENDPOINT: ${VLE_OTLP_ENDPOINT:-}
  VLE_OTLP_HEADERS: ${VLE_OTLP_HEADERS:-}
  VLE_REQUIRE_SEPARATION_OF_DUTIES: "true"
  VLE_ALLOW_DOCS: "false"
  VLE_AUTO_CREATE_SCHEMA: "false"
  VLE_AUTO_IMPORT_ENABLED: ${VLE_AUTO_IMPORT_ENABLED:-true}
  VLE_COURTLISTENER_ENABLED: ${VLE_COURTLISTENER_ENABLED:-true}
  VLE_COURTLISTENER_API_TOKEN: ${VLE_COURTLISTENER_API_TOKEN:-}
  VLE_COURTLISTENER_REQUEST_DELAY_SECONDS: ${VLE_COURTLISTENER_REQUEST_DELAY_SECONDS:-13}
  VLE_IMPORT_BATCH_SIZE: ${VLE_IMPORT_BATCH_SIZE:-3}
  VLE_IMPORT_POLL_SECONDS: ${VLE_IMPORT_POLL_SECONDS:-15}
  VLE_IMPORT_REFRESH_SECONDS: ${VLE_IMPORT_REFRESH_SECONDS:-86400}
  VLE_IMPORT_RECONCILE_SECONDS: ${VLE_IMPORT_RECONCILE_SECONDS:-604800}
  VLE_IMPORT_RECENT_DAYS: ${VLE_IMPORT_RECENT_DAYS:-90}
  VLE_IMPORT_START_DATE: ${VLE_IMPORT_START_DATE:-1700-01-01}
  VLE_IMPORT_MAX_RUN_SECONDS: ${VLE_IMPORT_MAX_RUN_SECONDS:-120}
  VLE_IMPORT_LEASE_SECONDS: ${VLE_IMPORT_LEASE_SECONDS:-180}
  VLE_LEGIFRANCE_ENABLED: ${VLE_LEGIFRANCE_ENABLED:-true}
  VLE_LEGIFRANCE_SOURCE: ${VLE_LEGIFRANCE_SOURCE:-piste}
  VLE_LEGIFRANCE_PISTE_CLIENT_ID: ${VLE_LEGIFRANCE_PISTE_CLIENT_ID:-}
  VLE_LEGIFRANCE_PISTE_CLIENT_SECRET: ${VLE_LEGIFRANCE_PISTE_CLIENT_SECRET:-}
  VLE_LEGIFRANCE_PISTE_ENVIRONMENT: ${VLE_LEGIFRANCE_PISTE_ENVIRONMENT:-production}
  VLE_INFERENCE_ENABLED: ${VLE_INFERENCE_ENABLED:-false}
  VLE_MODEL_PROVIDER: ${VLE_MODEL_PROVIDER:-ollama}
  VLE_MODEL_NAME: ${VLE_MODEL_NAME:-}
  VLE_MODEL_ENDPOINT: ${VLE_MODEL_ENDPOINT:-}
  VLE_MODEL_REVISION: ${VLE_MODEL_REVISION:-}
  VLE_MODEL_API_KEY: ${VLE_MODEL_API_KEY:-}
  VLE_REVIEWER_REGISTRY_PATH: ${VLE_REVIEWER_REGISTRY_PATH:-}
  VLE_REVIEWER_REGISTRY_SHA256: ${VLE_REVIEWER_REGISTRY_SHA256:-}
  VLE_RELEASE_ENFORCEMENT: ${VLE_RELEASE_ENFORCEMENT:-reviewed}
  VLE_RELEASE_PROFILE: ${VLE_RELEASE_PROFILE:-legacy}
  VLE_RELEASE_SOURCE_MAX_AGE_SECONDS: ${VLE_RELEASE_SOURCE_MAX_AGE_SECONDS:-172800}
  VLE_RELEASE_MAX_FALSE_COMPLIANCE_RATE: ${VLE_RELEASE_MAX_FALSE_COMPLIANCE_RATE:-0}
  VLE_RELEASE_EVIDENCE_PATH: ${VLE_RELEASE_EVIDENCE_PATH:-}
  VLE_RELEASE_EVIDENCE_SHA256: ${VLE_RELEASE_EVIDENCE_SHA256:-}

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: vle_legato
      POSTGRES_USER: vle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vle -d vle_legato"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      VLE_DATABASE_URL: postgresql+psycopg://vle:${POSTGRES_PASSWORD}@db:5432/vle_legato
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    build: .
    environment: *vle-environment
    volumes:
      - ${VLE_EVIDENCE_DIR:-./deployment-evidence}:/evidence:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build: .
    command: ["vle-legato-worker"]
    environment: *vle-environment
    volumes:
      - ${VLE_EVIDENCE_DIR:-./deployment-evidence}:/evidence:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time,tempfile; assert any(time.time()-p.stat().st_mtime < 300 for p in Path(tempfile.gettempdir()).glob('vle-worker-*/heartbeat'))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3


  importer:
    build: .
    command: ["vle-legato-importer"]
    environment: *vle-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time,tempfile; assert any(time.time()-p.stat().st_mtime < 900 for p in Path(tempfile.gettempdir()).glob('vle-import-*/heartbeat'))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:

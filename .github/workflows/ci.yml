name: production-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/service src/lifecycle.py tests/test_service.py
      - run: bandit -q -r src/service
      - run: pip-audit -r requirements-prod.txt

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: vle_legato_test
          POSTGRES_USER: vle
          POSTGRES_PASSWORD: test-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vle -d vle_legato_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VLE_DATABASE_URL: postgresql+psycopg://vle:test-postgres-password@127.0.0.1:5432/vle_legato_test
      VLE_TEST_POSTGRES_URL: postgresql+psycopg://vle:test-postgres-password@127.0.0.1:5432/vle_legato_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: python -m pytest -q tests/test_service.py -k postgres_migration

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: legal-norm-argumentation:ci
          load: true
      - uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: legal-norm-argumentation:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

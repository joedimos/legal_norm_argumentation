name: production-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/service src/legifrance.py src/legifrance_piste.py src/formalization.py src/lifecycle.py src/temporal.py src/temporal_deontic.py src/model_checking.py src/conflicts.py src/preferences.py src/audit_bundle.py src/research.py src/research_benchmark.py src/experiments.py src/priority.py src/defeasible.py src/compliance.py src/normative_model.py src/norm_extraction.py src/cli.py tests/test_service.py tests/test_legifrance.py tests/test_web_console_workflow.py tests/test_norm_extraction.py tests/test_research_logic.py tests/test_audit_bundle.py tests/test_research_benchmark.py tests/test_experiments.py
      - run: bandit -q -r src/service src/legifrance.py src/legifrance_piste.py src/audit_bundle.py src/model_checking.py src/experiments.py src/research.py src/temporal.py src/temporal_deontic.py
      - run: pip-audit -r requirements-prod.txt

  research-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,verification]'
      - run: python -m pytest -q tests/test_research_logic.py tests/test_research_benchmark.py tests/test_audit_bundle.py tests/test_experiments.py
      - name: Exhaustive semantic benchmark
        run: python -m src.cli benchmark --backend exhaustive > benchmark-exhaustive.json
      - name: SMT semantic benchmark
        run: python -m src.cli benchmark --backend z3 > benchmark-z3.json
      - name: Completion and amendment experiments (exhaustive)
        run: python -m src.cli experiment-benchmark --backend exhaustive > benchmark-experiments-exhaustive.json
      - name: Completion and amendment experiments (SMT)
        run: python -m src.cli experiment-benchmark --backend z3 > benchmark-experiments-z3.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-benchmarks
          path: benchmark-*.json
          if-no-files-found: error
          retention-days: 30

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: vle_legato_test
          POSTGRES_USER: vle
          POSTGRES_PASSWORD: test-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vle -d vle_legato_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VLE_DATABASE_URL: postgresql+psycopg://vle:test-postgres-password@127.0.0.1:5432/vle_legato_test
      VLE_TEST_POSTGRES_URL: postgresql+psycopg://vle:test-postgres-password@127.0.0.1:5432/vle_legato_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: python -m pytest -q tests/test_service.py -k postgres_migration

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: legal-norm-argumentation:ci
          load: true
          provenance: false
          sbom: false
      - name: Runtime smoke test
        run: >-
          docker run --rm legal-norm-argumentation:ci
          python -c "import importlib.metadata as md; assert md.version('urllib3') == '2.8.0'; assert md.version('msgpack') == '1.2.3'; assert not list(md.distributions(name='setuptools')); assert not list(md.distributions(name='pip')); import fastapi, spacy, sqlalchemy, src.legifrance_piste, src.service.app_with_ui; print('runtime-smoke-ok')"
      - name: Generate Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: legal-norm-argumentation:ci
          format: json
          output: trivy-report.json
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce Trivy HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: legal-norm-argumentation:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate final-image CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: legal-norm-argumentation:ci
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
      - name: Upload final-image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

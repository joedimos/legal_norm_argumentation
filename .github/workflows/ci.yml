name: production-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/legal_transport.py src/courtlistener.py src/legifrance_ip.py tests/test_automatic_imports.py
      - run: bandit -q -r src/legal_transport.py src/courtlistener.py src/legifrance_ip.py
      - run: ruff check src/checker src/certificates.py src/certificate_study.py src/obstruction.py src/obstruction_study.py src/metamorphic.py src/review_planning.py src/review_simulation.py src/geometry.py src/geometry_study.py src/persistence.py src/phase5_cli.py tests/test_phase5_*.py
      - run: ruff check src/phase4.py src/phase4_cli.py src/aspic.py src/assumptions.py src/assumptions_z3.py src/norm_codec.py src/redundancy src/ddl src/faithfulness.py src/certification.py tests/test_phase4_*.py tests/conftest.py
      - run: ruff check src/service src/legifrance.py src/legifrance_piste.py src/formalization.py src/lifecycle.py src/temporal.py src/temporal_deontic.py src/model_checking.py src/conflicts.py src/preferences.py src/audit_bundle.py src/research.py src/research_benchmark.py src/experiments.py src/evidence_planning.py src/family_contract.py src/interpretation_family.py src/observation_strategy.py src/response_alignment.py src/live_generation.py src/legal_annotation.py src/model_runtime.py src/signed_annotation.py src/priority.py src/defeasible.py src/compliance.py src/normative_model.py src/norm_extraction.py src/cli.py tests/test_service.py tests/test_production_workflows.py tests/test_legifrance.py tests/test_web_console_workflow.py tests/test_norm_extraction.py tests/test_research_logic.py tests/test_audit_bundle.py tests/test_research_benchmark.py tests/test_experiments.py tests/test_evidence_planning.py tests/test_interpretation_family.py tests/test_response_alignment.py tests/test_live_generation.py tests/test_legal_annotation.py tests/test_model_runtime.py tests/test_signed_annotation.py
      - run: bandit -q -r src/checker src/certificates.py src/certificate_study.py src/obstruction.py src/obstruction_study.py src/metamorphic.py src/review_planning.py src/review_simulation.py src/geometry.py src/geometry_study.py src/persistence.py src/phase5_cli.py
      - run: bandit -q -r src/phase4.py src/phase4_cli.py src/aspic.py src/assumptions.py src/assumptions_z3.py src/norm_codec.py src/redundancy src/ddl src/faithfulness.py
      - run: bandit -q -r src/service src/legifrance.py src/legifrance_piste.py src/audit_bundle.py src/model_checking.py src/experiments.py src/evidence_planning.py src/family_contract.py src/interpretation_family.py src/observation_strategy.py src/response_alignment.py src/live_generation.py src/legal_annotation.py src/model_runtime.py src/signed_annotation.py src/research.py src/temporal.py src/temporal_deontic.py
      - run: pip-audit -r requirements-prod.txt
      - name: Validate deployment Compose wiring
        env:
          POSTGRES_PASSWORD: ci-config-only-password
          VLE_BUILD_REVISION: ${{ github.sha }}
          VLE_API_KEYS_JSON: '[]'
          VLE_METRICS_BEARER_TOKEN: ci-config-only-not-a-real-secret-123456
        run: docker compose config --quiet

  research-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,verification,annotation]'
      - run: pip-audit -r requirements-annotation.txt
      - run: python -m pytest -q tests/test_research_logic.py tests/test_research_benchmark.py tests/test_audit_bundle.py tests/test_experiments.py tests/test_evidence_planning.py tests/test_interpretation_family.py tests/test_response_alignment.py tests/test_live_generation.py tests/test_legal_annotation.py tests/test_model_runtime.py tests/test_signed_annotation.py
      - name: Exhaustive semantic benchmark
        run: python -m src.cli benchmark --backend exhaustive > benchmark-exhaustive.json
      - name: SMT semantic benchmark
        run: python -m src.cli benchmark --backend z3 > benchmark-z3.json
      - name: Completion and amendment experiments (exhaustive)
        run: python -m src.cli experiment-benchmark --backend exhaustive > benchmark-experiments-exhaustive.json
      - name: Completion and amendment experiments (SMT)
        run: python -m src.cli experiment-benchmark --backend z3 > benchmark-experiments-z3.json
      - name: Interpretation-family semantic benchmark
        run: python -m src.cli family-benchmark > benchmark-families.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-benchmarks
          path: benchmark-*.json
          if-no-files-found: error
          retention-days: 30

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: vle_legato_test
          POSTGRES_USER: vle
          POSTGRES_PASSWORD: test-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vle -d vle_legato_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VLE_DATABASE_URL: postgresql+psycopg://vle:test-postgres-password@127.0.0.1:5432/vle_legato_test
      VLE_TEST_POSTGRES_URL: postgresql+psycopg://vle:test-postgres-password@127.0.0.1:5432/vle_legato_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: python -m pytest -q tests/test_service.py tests/test_production_workflows.py -k 'postgres_migration or immutability_postgres or parallel_worker_claim_postgres'
      - run: python -m pytest -q tests/test_automatic_imports.py -k parallel_claim_postgres
      - name: Freeze governed database baseline
        run: >-
          python -m src.service.operations --mode snapshot --deployment-id ci-restore
          --build-revision "$GITHUB_SHA" > /tmp/restore-baseline.json
      - name: Restore into an isolated database using server-matched PostgreSQL tools
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U vle -d vle_legato_test -Fc -f /tmp/drill.dump
          docker exec "$PG_CONTAINER" createdb -U vle vle_legato_restore
          docker exec "$PG_CONTAINER" pg_restore -U vle -d vle_legato_restore --exit-on-error /tmp/drill.dump
      - name: Verify restored schema, governed rows, and audit chain
        env:
          VLE_RESTORE_DATABASE_URL: postgresql+psycopg://vle:test-postgres-password@127.0.0.1:5432/vle_legato_restore
        run: |
          BASELINE_SHA=$(python -c 'from pathlib import Path; from src.model_runtime import strict_json; from src.audit_bundle import digest, canonical_json; print(digest(canonical_json(strict_json(Path("/tmp/restore-baseline.json").read_bytes()))))')
          python -m src.service.operations --mode restore --deployment-id ci-restore --build-revision "$GITHUB_SHA" --baseline /tmp/restore-baseline.json --baseline-sha256 "$BASELINE_SHA" --confirm-isolated > restore-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-restore-evidence
          path: restore-evidence.json
          if-no-files-found: error

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: legal-norm-argumentation:ci
          load: true
          provenance: false
          sbom: false
      - name: Runtime smoke test
        run: >-
          docker run --rm legal-norm-argumentation:ci
          python -c "import importlib.metadata as md; assert md.version('urllib3') == '2.8.0'; assert md.version('msgpack') == '1.2.3'; assert not list(md.distributions(name='setuptools')); assert not list(md.distributions(name='pip')); import fastapi, spacy, sqlalchemy, src.legifrance_piste, src.service.app_with_ui; print('runtime-smoke-ok')"
      - name: Generate Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: legal-norm-argumentation:ci
          format: json
          output: trivy-report.json
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce Trivy HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: legal-norm-argumentation:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate final-image CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: legal-norm-argumentation:ci
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
      - name: Upload final-image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  phase4-z3:
    # Optional runtime extra, verified separately from the core install. No live model/GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev,verification]'
      - name: Offline Phase 4 schema, differential, property and fail-closed checks
        run: >-
          python -m pytest -q tests/test_phase4_*.py
          --cov=src.phase4 --cov=src.phase4_cli --cov=src.aspic
          --cov=src.assumptions --cov=src.assumptions_z3 --cov=src.norm_codec
          --cov=src.redundancy --cov=src.ddl --cov=src.faithfulness
          --cov-report=json:phase4-coverage.json --cov-report=term --cov-fail-under=80
      - name: Require every new module to meet the baseline coverage
        run: |
          python - <<'PY'
          import json
          report = json.load(open('phase4-coverage.json'))
          low = {p: v['summary']['percent_covered'] for p, v in report['files'].items()
                 if v['summary']['percent_covered'] < 80}
          if low:
              raise SystemExit(str(low))
          PY
      - run: python -m src.cli benchmark --backend exhaustive > phase4-legacy-exhaustive.json
      - run: python -m src.cli benchmark --backend z3 > phase4-legacy-z3.json
      - run: python -m src.cli experiment-benchmark --backend exhaustive > phase4-experiments-exhaustive.json
      - run: python -m src.cli experiment-benchmark --backend z3 > phase4-experiments-z3.json
      - run: python -m src.cli family-benchmark > phase4-families.json
      - run: python -m src.cli faithfulness > phase4-faithfulness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-reproducibility
          path: phase4-*.json
          if-no-files-found: error
          retention-days: 30

  phase5-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev,verification,geometry]'
      - name: Offline Phase 5 differential, property, mutation and schema checks
        run: >-
          python -m pytest -q tests/test_phase5_*.py
          --cov=src.checker --cov=src.certificates --cov=src.certificate_study
          --cov=src.obstruction --cov=src.obstruction_study --cov=src.metamorphic
          --cov=src.review_planning --cov=src.review_simulation --cov=src.geometry
          --cov=src.geometry_study --cov=src.persistence --cov=src.phase5_cli
          --cov-report=json:phase5-coverage.json --cov-report=term --cov-fail-under=80
      - name: Preserve every new module's baseline coverage
        run: |
          python - <<'PY'
          import json
          report = json.load(open('phase5-coverage.json'))
          low = {p: v['summary']['percent_covered'] for p, v in report['files'].items()
                 if v['summary']['percent_covered'] < 80}
          if low:
              raise SystemExit(str(low))
          PY
      - run: python -m src.certificate_study > phase5-certificate-tampering.json
      - run: python -c 'import json; from src.certificate_study import runtime_mutations; print(json.dumps(runtime_mutations()))' > phase5-runtime-mutations.json
      - run: python -m src.obstruction_study > phase5-obstructions.json
      - run: python -m src.review_simulation > phase5-review-simulation.json
      - run: python -m src.geometry_study > phase5-geometry-simulation.json
      - run: python -m src.cli metamorphic --input benchmarks/metamorphic-v1.json --provider extractor > phase5-metamorphic-current.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-reproducibility
          path: phase5-*.json
          if-no-files-found: error
          retention-days: 30

  automatic-ip-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Offline automated import recovery, safety and provider contracts
        run: >-
          python -m pytest -q tests/test_automatic_imports.py tests/test_legifrance.py
          --cov=src.legal_transport --cov=src.courtlistener --cov=src.legifrance_ip
          --cov=src.service.automatic_imports --cov=src.service.legifrance_ingestion
          --cov-report=json:ip-import-coverage.json --cov-report=term --cov-fail-under=80
      - name: Require each acquisition module to meet the coverage floor
        run: |
          python - <<'PY'
          import json
          report = json.load(open('ip-import-coverage.json'))
          low = {p: v['summary']['percent_covered'] for p, v in report['files'].items()
                 if v['summary']['percent_covered'] < 80}
          if low:
              raise SystemExit(str(low))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-ip-import-coverage
          path: ip-import-coverage.json
          if-no-files-found: error

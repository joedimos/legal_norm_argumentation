[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-norm-argumentation"
version = "0.3.0"
description = "Production-hardened VLE-LEGATO toolkit for norm extraction, formalisation, reasoning, audit, and compliance"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "networkx==3.7",
  "pandas==3.0.6",
  "spacy==3.8.16",
  "fastapi==0.143.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "uvicorn[standard]==0.53.0",
  "SQLAlchemy==2.1.3",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "prometheus-client==0.26.0",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "httpx==0.28.1",
  "ruff==0.14.1",
  "bandit==1.8.6",
  "pip-audit==2.9.0",
]
transformers = ["transformers>=4.40,<6"]

[project.scripts]
vle-legato = "src.cli:main"
vle-legato-api = "src.service.app:app"
vle-legato-maintenance = "src.service.maintenance:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]
